amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.02
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 4.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 120               # more beams for real sensor
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.2
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5     # real TF has more latency than sim
    update_min_a: 0.02           # update frequently on real hardware
    update_min_d: 0.02
    z_hit: 0.6
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: false
    initial_pose:
      x: 1.35
      y: 0.0
      z: 0.0
      yaw: -1.57

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    transform_tolerance: 1.0     # extra tolerance for real latency
    filter_duration: 0.3
    always_reload_bt_xml: false
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0   # half of sim — safer on real hardware
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10           # conservative on real hardware
      min_approach_linear_velocity: 0.025
      lookahead_dist: 0.15
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.30
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.20
      transform_tolerance: 0.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.06
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.3
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.40
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
    enable_stamped_cmd_vel: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 0.5
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.05
      footprint: "[[0.10, 0.10], [0.10, -0.10], [-0.11, -0.10], [-0.11, 0.10]]"
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.20
        cost_scaling_factor: 10