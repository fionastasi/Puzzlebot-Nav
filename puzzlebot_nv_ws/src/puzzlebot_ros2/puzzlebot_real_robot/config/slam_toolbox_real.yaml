slam_toolbox:
  ros__parameters:
    use_sim_time: false

    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint  # real robot uses base_footprint, not base_link
    scan_topic: /scan

    # TF and timing
    transform_timeout: 1.0
    transform_publish_period: 0.05   # publish TF at 20 Hz
    tf_buffer_duration: 30.0
    minimum_time_interval: 0.5

    # Map resolution and range
    resolution: 0.05                 # 5 cm cells
    max_laser_range: 12.0
    min_laser_range: 0.25            # RPLidar A1 blind spot

    # Map updates
    map_update_interval: 2.0
    enable_interactive_mode: true    # allow manual pose corrections in RViz

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true